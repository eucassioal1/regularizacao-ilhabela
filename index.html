// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();

      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});


</script>

function applyPaletteToRoot(paletteKey, themeKey) {
  const p = PALETTES[paletteKey] || PALETTES.mare;
  const vars = p[themeKey] || p.light;
  Object.entries(vars).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  document.documentElement.setAttribute('data-theme', themeKey);
}

/* ───────── Hooks: reveal on scroll + count up + scroll direction ───────── */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let done = false;
    const show = () => { if (!done) { done = true; el.classList.add('is-visible'); } };
    // Safety net: if IntersectionObserver never fires (some embedded viewers),
    // reveal anyway so content is never stranded at opacity 0.
    const fallback = setTimeout(show, 400);
    const io = new IntersectionObserver(
      (entries) => entries.forEach(e => { if (e.isIntersecting) { clearTimeout(fallback); show(); io.unobserve(el); } }),
      { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }
    );
    io.observe(el);
    return () => { clearTimeout(fallback); io.disconnect(); };
  }, []);
  return ref;
}

function Reveal({ delay = 0, as: As = 'div', style, children, ...rest }) {
  const ref = useReveal();
  return (
    <As ref={ref} className={'reveal ' + (rest.className || '')} style={{ ...style, transitionDelay: delay + 'ms' }} {...rest}>
      {children}
    </As>
  );
}

function useCountUp(target, durationMs = 1400) {
  const [value, setValue] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let started = false, timer = 0;
    // Timer-driven tween: requestAnimationFrame is not guaranteed to deliver
    // frames in embedded viewers, so step on an interval instead.
    const run = () => {
      if (started) return;
      started = true;
      const startedAt = Date.now();
      timer = setInterval(() => {
        const p = Math.min(1, (Date.now() - startedAt) / durationMs);
        const eased = 1 - Math.pow(1 - p, 4);
        setValue(Math.round(target * eased));
        if (p >= 1) clearInterval(timer);
      }, 32);
    };
    const fallback = setTimeout(run, 500);
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { clearTimeout(fallback); run(); io.unobserve(el); }
      });
    }, { threshold: 0.5 });
    io.observe(el);
    return () => { clearTimeout(fallback); clearInterval(timer); io.disconnect(); };
  }, [target, durationMs]);
  return [value, ref];
}

function useScrollDir() {
  const [hidden, setHidden] = useState(false);
  useEffect(() => {
    let last = window.scrollY;
    const onScroll = () => {
      const y = window.scrollY;
      if (y > 240 && y > last + 8) setHidden(true);
      else if (y < last - 8) setHidden(false);
      last = y;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return hidden;
}

/* ───────── Image with subtle parallax on scroll ───────── */
function ParallaxImage({ src, alt, ratio = '5 / 4', intensity = 12 }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const img = el.querySelector('img');
    if (!img) return;
    let scheduled = false;
    const update = () => {
      scheduled = false;
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight;
      const center = r.top + r.height / 2;
      const offset = (center - vh / 2) / vh; // -1..1
      img.style.transform = 'scale(1.08) translate3d(0,' + (offset * -intensity).toFixed(1) + 'px,0)';
    };
    // Throttle with a timer, not rAF — rAF may never deliver a frame here.
    const onScroll = () => { if (!scheduled) { scheduled = true; setTimeout(update, 16); } };
    update();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
  }, [intensity]);
  return (
    <div ref={ref} className="hero-img" style={{ aspectRatio: ratio }}>
      <img src={src} alt={alt} loading="lazy" />
    </div>
  );
}

/* ───────── Brand dot pattern (from social identity) ───────── */
function DotPattern({ rows = 6, cols = 6, size = 6, gap = 24, color = 'var(--ink)', altColor, style }) {
  const w = (cols - 1) * gap + size;
  const h = (rows - 1) * gap + size;
  const dots = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const useAlt = altColor && ((r + c) % 3 === 0);
      dots.push(<circle key={r + 'x' + c} cx={c * gap + size / 2} cy={r * gap + size / 2} r={size / 2} fill={useAlt ? altColor : color} />);
    }
  }
  return (
    <svg viewBox={'0 0 ' + w + ' ' + h} width={w} height={h} style={{ display: 'block', ...style }}>
      {dots}
    </svg>
  );
}

/* ───────── Lead hook inside Consulta — 3-field qualifier ───────── */
function ConsultaLeadForm() {
  const [form, setForm] = useState({ nome: '', telefone: '', bairro: '', situacao: 'Casa ampliada sem alvará' });
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);

  const validate = () => {
    const e = {};
    if (!form.nome.trim()) e.nome = 'Informe seu nome';
    if (form.telefone.replace(/\D/g, '').length < 10) e.telefone = 'WhatsApp inválido';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const onSubmit = (ev) => {
    ev.preventDefault();
    if (!validate()) return;
    const msg = encodeURIComponent(
      'Olá Cássio! Quero agendar a Consulta de Regularização.\n\n' +
      'Nome: ' + form.nome + '\n' +
      'WhatsApp: ' + form.telefone + '\n' +
      (form.bairro ? 'Bairro do imóvel: ' + form.bairro + '\n' : '') +
      'Situação: ' + form.situacao
    );
    window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + msg, '_blank');
    setSent(true);
  };

  if (sent) {
    return (
      <div style={{ padding: '28px 0 8px', textAlign: 'center' }}>
        <div className="eyebrow" style={{ marginBottom: 14 }}>Solicitação enviada</div>
        <p className="serif" style={{ fontSize: 26, lineHeight: 1.2, margin: '0 0 12px' }}>
          Vamos confirmar sua visita técnica.
        </p>
        <p style={{ margin: 0, fontSize: 14.5, color: 'var(--ink-soft)', lineHeight: 1.5 }}>
          Retornamos em até 24h úteis com as datas disponíveis.
        </p>
        <button className="btn btn-ghost" style={{ marginTop: 22 }} onClick={() => { setSent(false); setForm({ nome: '', telefone: '', bairro: '', situacao: 'Casa ampliada sem alvará' }); }}>
          Enviar outra solicitação
        </button>
      </div>
    );
  }

  return (
    <form onSubmit={onSubmit} style={{ display: 'grid', gap: 20, marginTop: 26, paddingTop: 26, borderTop: '1px solid var(--rule)' }}>
      <div className="eyebrow">Solicitar agendamento</div>
      <div className="field">
        <label htmlFor="cl-nome">Nome</label>
        <input id="cl-nome" type="text" value={form.nome} onChange={e => setForm({ ...form, nome: e.target.value })} />
        {errors.nome && <span className="field-error">{errors.nome}</span>}
      </div>
      <div className="field">
        <label htmlFor="cl-tel">WhatsApp</label>
        <input id="cl-tel" type="tel" value={form.telefone} onChange={e => setForm({ ...form, telefone: e.target.value })} placeholder="(12) 99999-9999" />
        {errors.telefone && <span className="field-error">{errors.telefone}</span>}
      </div>
      <div className="field">
        <label htmlFor="cl-bairro">Bairro do imóvel</label>
        <input id="cl-bairro" type="text" value={form.bairro} onChange={e => setForm({ ...form, bairro: e.target.value })} placeholder="Perequê, Barra Velha, Vila..." />
      </div>
      <div className="field">
        <label htmlFor="cl-sit">Situação do imóvel</label>
        <select id="cl-sit" value={form.situacao} onChange={e => setForm({ ...form, situacao: e.target.value })}>
          <option>Casa ampliada sem alvará</option>
          <option>Construção sem aprovação</option>
          <option>Divergência com a matrícula</option>
          <option>Comércio ou pousada irregular</option>
          <option>Não sei dizer ainda</option>
        </select>
      </div>
      <button type="submit" className="btn btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
        Agendar minha consulta
        <span className="arr">→</span>
      </button>
      <div className="mono" style={{ fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--ink-mute)', textAlign: 'center' }}>
        Janela legal aberta · encerra 10/06/2027
      </div>
    </form>
  );
}

/* ───────── CONTACT FORM ───────── */
function ContactForm() {
  const [form, setForm] = useState({ nome: '', email: '', telefone: '', imovel: 'Residencial', mensagem: '' });
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);

  const validate = () => {
    const e = {};
    if (!form.nome.trim()) e.nome = 'Informe seu nome';
    if (!form.email.trim() || !/^\S+@\S+\.\S+$/.test(form.email)) e.email = 'E-mail inválido';
    if (!form.telefone.trim() || form.telefone.replace(/\D/g, '').length < 10) e.telefone = 'Telefone inválido';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const onSubmit = (ev) => {
    ev.preventDefault();
    if (!validate()) return;
    const msg = encodeURIComponent(
      'Olá Cássio! Sou ' + form.nome + ' (' + form.email + ', ' + form.telefone + ').\n' +
      'Quero agendar a consulta de regularização para meu imóvel ' + form.imovel.toLowerCase() + ' em Ilhabela.\n\n' +
      (form.mensagem || '')
    );
    window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + msg, '_blank');
    setSent(true);
  };

  const field = (key, label, type, extra) => (
    <div className="field">
      <label htmlFor={key}>{label}</label>
      <input id={key} type={type || 'text'} value={form[key]} onChange={e => setForm({ ...form, [key]: e.target.value })} {...(extra || {})} />
      {errors[key] && <span className="field-error">{errors[key]}</span>}
    </div>
  );

  if (sent) {
    return (
      <div style={{ padding: '40px 0', textAlign: 'center' }}>
        <div className="eyebrow" style={{ marginBottom: 18 }}>Recebido</div>
        <h3 className="serif" style={{ fontSize: 36, lineHeight: 1.1, margin: '0 0 16px', maxWidth: 480, marginLeft: 'auto', marginRight: 'auto' }}>
          Sua mensagem foi enviada via WhatsApp.
        </h3>
        <p style={{ color: 'var(--ink-soft)', maxWidth: 460, margin: '0 auto' }}>
          Em breve retornaremos com uma análise inicial do seu caso. Obrigado!
        </p>
        <button className="btn btn-ghost" style={{ marginTop: 28 }} onClick={() => { setSent(false); setForm({ nome:'', email:'', telefone:'', imovel:'Residencial', mensagem:'' }); }}>
          Enviar outra mensagem
        </button>
      </div>
    );
  }

  return (
    <form onSubmit={onSubmit} style={{ display: 'grid', gap: 26 }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 26 }} className="form-row">
        {field('nome', 'Nome')}
        {field('email', 'E-mail', 'email')}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 26 }} className="form-row">
        {field('telefone', 'WhatsApp', 'tel')}
        <div className="field">
          <label htmlFor="imovel">Tipo de imóvel</label>
          <select id="imovel" value={form.imovel} onChange={e => setForm({ ...form, imovel: e.target.value })}>
            <option>Residencial</option>
            <option>Comercial</option>
            <option>Pousada</option>
            <option>Misto</option>
            <option>Outro</option>
          </select>
        </div>
      </div>
      <div className="field">
        <label htmlFor="mensagem">Conte-nos sobre seu imóvel (opcional)</label>
        <textarea id="mensagem" value={form.mensagem} onChange={e => setForm({ ...form, mensagem: e.target.value })} placeholder="Ex.: Casa em Perequê, ~180 m²..." />
      </div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 14, flexWrap: 'wrap', marginTop: 8 }}>
        <div style={{ fontSize: 13, color: 'var(--ink-mute)' }} className="mono">→ retornamos em 24h úteis</div>
        <button type="submit" className="btn btn-primary">
          Agendar via WhatsApp
          <span className="arr">→</span>
        </button>
      </div>
      <style>{`@media (max-width: 720px){ .form-row{ grid-template-columns: 1fr !important; } }`}</style>
    </form>
  );
}

/* ───────── Tweaks panel ───────── */
function Tweaks({ tweaks, setTweak }) {
  return (
    <window.TweaksPanel>
      <window.TweakSection label="Aparência" />
      <window.TweakSelect
        label="Paleta"
        value={tweaks.palette}
        onChange={v => setTweak('palette', v)}
        options={Object.entries(PALETTES).map(([k, p]) => ({ value: k, label: p.label }))}
      />
      <window.TweakRadio
        label="Modo"
        value={tweaks.theme}
        onChange={v => setTweak('theme', v)}
        options={[{ value: 'light', label: 'Claro' }, { value: 'dark', label: 'Escuro' }]}
      />
      <window.TweakSection label="Seções visíveis" />
      <window.TweakToggle label="A lei" value={tweaks.showSecLaw} onChange={v => setTweak('showSecLaw', v)} />
      <window.TweakToggle label="Elegibilidade" value={tweaks.showSecElig} onChange={v => setTweak('showSecElig', v)} />
      <window.TweakToggle label="Prazos" value={tweaks.showSecDocs} onChange={v => setTweak('showSecDocs', v)} />
      <window.TweakToggle label="Multas" value={tweaks.showSecCp} onChange={v => setTweak('showSecCp', v)} />
      <window.TweakToggle label="Processo" value={tweaks.showSecSteps} onChange={v => setTweak('showSecSteps', v)} />
      <window.TweakToggle label="Consulta" value={tweaks.showSecConsulta} onChange={v => setTweak('showSecConsulta', v)} />
      <window.TweakToggle label="Potencial construtivo" value={tweaks.showSecPot} onChange={v => setTweak('showSecPot', v)} />
      <window.TweakToggle label="FAQ" value={tweaks.showSecFaq} onChange={v => setTweak('showSecFaq', v)} />
      <window.TweakToggle label="Notícias" value={tweaks.showSecNews} onChange={v => setTweak('showSecNews', v)} />
      <window.TweakToggle label="Contato" value={tweaks.showSecContact} onChange={v => setTweak('showSecContact', v)} />
    </window.TweaksPanel>
  );
}

/* ───────── App root ───────── */
function App() {
  const [tweaks, setTweak] = window.useTweaks(window.TWEAK_DEFAULTS);

  useEffect(() => {
    applyPaletteToRoot(tweaks.palette, tweaks.theme);
  }, [tweaks.palette, tweaks.theme]);

  const navLinks = [
    tweaks.showSecLaw && { href: '#lei', label: 'A lei' },
    tweaks.showSecConsulta && { href: '#consulta', label: 'Consulta' },
    tweaks.showSecPot && { href: '#potencial', label: 'Potencial' },
    tweaks.showSecCp && { href: '#contrapartida', label: 'Multas' },
    tweaks.showSecSteps && { href: '#processo', label: 'Processo' },
    tweaks.showSecFaq && { href: '#faq', label: 'FAQ' },
    tweaks.showSecContact && { href: '#contato', label: 'Agendar' },
  ].filter(Boolean);

  const onWhatsapp = () => {
    const msg = encodeURIComponent('Olá Cássio! Gostaria de agendar a Consulta de Regularização para meu imóvel em Ilhabela. Pode me passar os próximos passos?');
    window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + msg, '_blank');
  };
  const onConsulta = () => {
    const el = document.getElementById('contato');
    if (el) window.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' });
  };

  return (
    <>
      <Nav navLinks={navLinks} onWhatsapp={onWhatsapp} />
      <main>
        <Hero onWhatsapp={onWhatsapp} />
        {tweaks.showSecLaw && <Lei />}
        {tweaks.showSecElig && <Elegibilidade />}
        {tweaks.showSecDocs && <Prazos />}
        {tweaks.showSecCp && <Contrapartida />}
        {tweaks.showSecSteps && <Passos />}
        {tweaks.showSecConsulta && <Consulta onConsulta={onConsulta} />}
        {tweaks.showSecPot && <PotencialConstrutivo />}
        {tweaks.showSecFaq && <FAQ />}
        {tweaks.showSecNews && <Noticias />}
        {tweaks.showSecContact && <Contato />}
      </main>
      <Footer />
      <Tweaks tweaks={tweaks} setTweak={setTweak} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
